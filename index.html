<style>

.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--wnb);color:var(--wn)}.bad{background:var(--bdb);color:var(--bd2)}

.hint{min-height:20px;font-size:14px;margin-top:8px}.neg{color:var(--bd2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.best{background:var(--okb);color:var(--ok);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-weight:700}
.empty{color:var(--mut);padding:12px;text-align:center}

.nm{min-width:90px;width:130px;font-weight:700;text-align:center}
.vt th:first-child,.vt td:first-child{position:sticky;inset-inline-start:0;z-index:1}
.vt th:first-child{background:var(--card)}
.vt td:first-child{box-shadow:inset -4px 0 0 var(--c,transparent)}
.vt tr.r-ok,.vt tr.r-ok td:first-child{background:var(--okb);--c:var(--ok)}
.vt tr.r-warn,.vt tr.r-warn td:first-child{background:var(--wnb);--c:var(--wn)}
.vt tr.r-crit,.vt tr.r-crit td:first-child,.vt tr.r-bad,.vt tr.r-bad td:first-child{background:var(--bdb);--c:var(--bd2)}

.vt tr.r-ok,.vt tr.r-ok td:first-child{background:color-mix(in srgb,var(--okb) 40%,var(--card))}
.vt tr.r-warn,.vt tr.r-warn td:first-child{background:color-mix(in srgb,var(--wnb) 75%,var(--card))}
.vt tr.r-crit,.vt tr.r-crit td:first-child{background:color-mix(in srgb,var(--bdb) 70%,var(--card))}}
.tag.crit{background:var(--bd2);color:var(--card)}
.wnt{color:var(--wn);font-weight:700}
.why{display:block;margin-top:4px;font-size:13px;font-weight:700;color:var(--c,var(--mut))}

:root[data-theme="dark"]{--bg:#15171c;--card:#1e2127;--tx:#d4d8de;--mut:#98a0ab;--bd:#30353e;--ok:#7bd3a0;--okb:#1a3226;--wn:#e6c07a;--wnb:#35301d;--bd2:#f0a3a5;--bdb:#392529;--p-vc:#b8383c;--p-ig:#7e55a8;--p-cash:#2a8553;--p-net:#3a6fc9}
.go{box-shadow:none}.go:hover{filter:brightness(1.08)}.go:active{filter:brightness(.95)}

<script>

const sod=()=>{const c=cn();return Date.now()-(c-new Date(c.getFullYear(),c.getMonth(),c.getDate()))},som=()=>{const c=cn();return Date.now()-(c-new Date(c.getFullYear(),c.getMonth(),1))};
const net=(p,since=0)=>S.tx.filter(x=>p(x)&&x.t>=since).reduce((a,x)=>a+(x.dir=='in'?x.amt:-x.amt-(x.ded||0)),0);
const used=(id,since,dir)=>S.tx.filter(x=>x.sec=='vc'&&x.line==id&&x.dir==dir&&x.t>=since&&!x.adj).reduce((a,x)=>a+x.amt,0);

const fee=(a,sec)=>{if(a<=0)return 0;const th=700,r=S.fee.r;return a<th?S.fee.lo:Math.ceil(a*r/100/S.fee.s-1e-9)*S.fee.s};
const rnd=c=>c%100==0?4:c%50==0?3:c%10==0?2:c%5==0?1:0;

const M=()=>!!ME&&ME.role=='shop',ymd=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:'Africa/Cairo'});
const fwOps=m=>S.tx.filter(x=>x.sec=='cash'&&x.line==m.id),fwNet=(m,pr)=>fwOps(m).filter(x=>pr(ymd(x.t))).reduce((a,x)=>a+(x.dir=='out'?x.amt:-x.amt),0),fwBalAt=(m,u)=>{const r=S.fw.find(d=>d.line==m.id&&d.day<u);return r?(r.closing!=null?r.closing+fwNet(m,d=>d>r.day&&d<u):r.opening+fwNet(m,d=>d>=r.day&&d<u)):(m.open||0)+fwNet(m,d=>d<u)},fwBal=()=>S.fwm.reduce((a,m)=>a+fwBalAt(m,'9999'),0),fwMove=()=>0,fwProf=sd=>S.fw.filter(d=>d.closing!=null&&d.day>=sd).reduce((a,d)=>{const m=S.fwm.find(m=>m.id==d.line);if(!m)return a;const base=S.fw.some(r=>r.line==d.line&&r.day<d.day)?fwBalAt(m,d.day):d.opening;return a+d.closing-base-fwNet(m,x=>x==d.day)},0);
let delId=null;
function status(l){const calc=dir=>{const rd=S.lim.d-used(l.id,sod(),dir),rm=S.lim.m-used(l.id,som(),dir);return{rd,rm,pd:S.lim.d>0?rd/S.lim.d:1,pn:S.lim.m>0?rm/S.lim.m:1}},o=calc('out'),i=calc('in');
 const c=[[o.pd,'تحويل اليومي'],[o.pn,'تحويل الشهري'],[i.pd,'استلام اليومي'],[i.pn,'استلام الشهري']].reduce((a,x)=>x[0]<a[0]?x:a),p=c[0],src=c[1];
 const z=[o.rd,o.rm,i.rd,i.rm].some(v=>v<=0);
 const st=z?['خلص','bad']:p<=.05?['على آخره','crit']:p<=.25?['قرّب','warn']:['تمام','ok'];return{o,i,p,src,st}}

 if(!a.length)return'<div class="empty">مفيش معاملات لسه. سجّل أول معاملة من فوق.</div>';
 return'<div class="tw"><table><tr><th>الوقت</th><th>تفاصيل</th><th>العملية</th><th>المبلغ</th><th>الرسوم</th>'+(m?'<th>خصم الشركة</th><th></th>':'')+'</tr>'+a.map(x=>{const l=L.find(l=>l.id==x.line);
 return`<tr><td>${tm(x.t)}</td><td>${(x.sec=='vc'||x.sec=='ig')&&l?l.name:x.note||'-'}</td><td><span class="tag ${x.dir=='in'?'ok':'warn'}">${x.adj?'تسوية':x.cap?'رأس مال':opL(x.sec,x.dir)}</span></td><td>${f(x.amt)}</td><td>${x.fee?f(x.fee):'-'}</td>${m?`<td>${x.ded?f(x.ded):'-'}</td><td>${x.auto?'<span class="mut">تلقائي</span>':`<button class="ghost" onclick="del(${x.id})">${delId==x.id?'تأكيد الحذف؟':'حذف'}</button>`}</td>`:''}</tr>`}).join('')+'</table></div>'}
async function del(id){if(delId==id){await q(sb.from('transactions').delete().or(`id.eq.${id},ref.eq.${id}`));delId=null;await load()}else delId=id;render()}
async function txRun(e,sec){e.preventDefault();if(fm0(e)&&!e.target.line.value){alert('ضيف '+(sec=='ig'?'حساب':'خط')+' الأول');return false}const fm=e.target,amt=+fm.amt.value;if(!(amt>0))return false;const w=fm.dir.value=='in',sh=ME.shop_id;
 if(sec=='ajil'){const nm=fm.who.value.trim()||'-',r=await q(sb.from('transactions').insert({shop_id:sh,sec,dir:fm.dir.value,amt,note:nm}).select().single());if(r.data){S.tx.push(mapTx(r.data));if(fm.link.checked){const r2=await q(sb.from('transactions').insert({shop_id:sh,sec:'cash',dir:w?'out':'in',amt,auto:true,ref:r.data.id,note:'آجل - '+nm}).select().single());if(r2.data)S.tx.push(mapTx(r2.data))}}}
 else if(sec=='cash'){const r=await q(sb.from('transactions').insert({shop_id:sh,sec,dir:fm.dir.value,amt,note:'يدوي'}).select().single());if(r.data)S.tx.push(mapTx(r.data))}
 else{const fe=+fm.fee.value||0,r=await q(sb.from('transactions').insert({shop_id:sh,sec,line_id:+fm.line.value,dir:fm.dir.value,amt,fee:fe,ded:dd(amt,fm.dir.value)}).select().single());
  if(r.data){S.tx.push(mapTx(r.data));if(fm.link.checked){const r2=await q(sb.from('transactions').insert({shop_id:sh,sec:'cash',dir:w?'out':'in',amt:w?amt-fe:amt+fe,auto:true,ref:r.data.id,note:(sec=='vc'?'الكاش':'إنستا باي')+(w?' - استلام':' - تحويل')}).select().single());if(r2.data)S.tx.push(mapTx(r2.data))}}}
 if(sec=='vc')S.cur=+fm.line.value;if(sec=='ig')S.curIg=+fm.line.value;render();focusAmt();bgLoad();return false}
function hint(fm){const h=fm.querySelector('.hint'),amt=+fm.amt.value,w=fm.dir.value=='in';
 if(!fm.fee.dataset.m)fm.fee.value=amt>0&&w?feeIn(amt,fm.dataset.s):'';if(!(amt>0)){h.innerHTML='';return}
 const fe=+fm.fee.value||0,de=dd(amt,fm.dir.value),la=amt,cs=w?amt-fe:amt+fe;let m='';
 if(fm.dataset.s=='vc'&&fm.line.value){const s=status(S.lines.find(l=>l.id==+fm.line.value)),d=w?s.i:s.o,k=w?'الاستلام':'التحويل';if(la>d.rd)m='⚠ هيعدّي ليميت '+k+' اليومي';else if(la>d.rm)m='⚠ هيعدّي ليميت '+k+' الشهري'}

const opForm=sec=>`<form data-s="${sec}" onsubmit="return tx(event,'${sec}')" oninput="if(event.target.name=='fee')this.fee.dataset.m=1;hint(this)"><div class="row">

 <label>العملية<select name="dir"><option value="in">استلام</option><option value="out">تحويل</option></select></label>
 <label>المبلغ<input name="amt" type="text" inputmode="decimal" min="1" step="any"></label>

function lineRow(r){const ed=S.edit==r.l.id&&M(),id=r.l.id;

 <div class="card"><div class="row"><button class="ghost" onclick="exportCsv()">تصدير المعاملات (CSV)</button></div></div>${dataCard()}`};

// ===== تعديلات: الإجمالي في كل قسم + فوري (ماكينة فيها حساب رئيسي وحساب كاش أوت) + الرسوم =====
const totCard=(t,v)=>`<div class="card" style="text-align:center"><div class="mut">${t}</div><div class="big ${v<0?'neg':''}">${f(v)}</div></div>`;
{const _vc=vcView,_ig=igView,_aj=ajView;
 vcView=()=>totCard('إجمالي أرصدة الكاش',S.lines.reduce((a,l)=>a+l.open,0)+net(x=>x.sec=='vc'))+_vc();
 igView=()=>totCard('إجمالي أرصدة إنستا باي',S.igs.reduce((a,l)=>a+l.open,0)+net(x=>x.sec=='ig'))+_ig();
 ajView=()=>totCard('إجمالي الآجل (الصافي: ليك − عليك)',net(x=>x.sec=='ajil'))+_aj()}
/* فوري: كل ماكينة فيها حسابين: رئيسي (الماكينة نفسها) وكاش أوت (حساب تابع ليها بيتسجل باسم "اسم الماكينة · كاش أوت") */
const CO_MARK=' · كاش أوت',isCOm=m=>un(m.name).endsWith(CO_MARK),legacyCO=m=>/^كاش\s*[أا]وت$/.test(un(m.name).trim());
const fwMachines=()=>{const o=S.fwm.filter(m=>!isCOm(m)&&!legacyCO(m));return o.length?o:S.fwm.filter(m=>!isCOm(m))};
const fwCOof=m=>S.fwm.find(x=>un(x.name)==un(m.name)+CO_MARK)||((fwMachines()[0]||{}).id==m.id?S.fwm.find(x=>legacyCO(x)&&!fwMachines().includes(x)):null)||null;
const fwCOs=()=>S.fwm.filter(m=>!fwMachines().includes(m)),fwTot=ms=>ms.reduce((a,m)=>a+fwBalAt(m,'9999'),0),baseName=m=>un(m.name).replace(CO_MARK,'');
fwView=function(){const td=ymd(Date.now()),mg=M(),MS=fwMachines(),ops=S.tx.filter(x=>x.sec=='cash'&&x.line&&S.fwm.some(m=>m.id==x.line));
 const acct=(k,title)=>{const t=S.fw.find(d=>d.day==td&&d.line==k.id)||{},hist=S.fw.some(d=>d.line==k.id)||S.tx.some(x=>x.line==k.id),op=t.opening!=null?t.opening:hist?Math.round(fwBalAt(k,td)*100)/100:'',cur=Math.round(fwBalAt(k,'9999')*100)/100;
  return{hist,html:`<div style="border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px"><b>${title}</b> <span class="mut">الرصيد الحالي: ${f(cur)}</span>
  ${mg?`<form onsubmit="return fwSetBal(event)" style="margin:8px 0"><input type="hidden" name="m" value="${k.id}"><div class="row"><label>اكتب الرصيد الحالي (تعديل)<input name="b" type="text" inputmode="decimal" required value="${cur}"></label><button class="go">تعديل الرصيد</button></div></form>`:''}
  <form onsubmit="return saveFw(event)"><input type="hidden" name="m" value="${k.id}"><div class="row"><label>الرصيد الافتتاحي<input name="o" type="text" inputmode="decimal" required value="${op}"></label><label>الرصيد الختامي<input name="c" type="text" inputmode="decimal" value="${t.closing??''}"></label><button class="go">حفظ</button></div></form></div>`}};
 const cards=MS.map(m=>{const co=fwCOof(m),a=acct(m,'الحساب الرئيسي'),c=co?acct(co,'حساب كاش أوت'):null,tot=fwTot([m,...(co?[co]:[])]);
  return`<div class="card"><h2>${m.name} <span class="mut" style="font-size:14px">إجمالي الماكينة: ${f(tot)}</span>${mg&&!a.hist&&!co?` <button class="ghost" onclick="rmLine(${m.id})">حذف الماكينة</button>`:''}</h2>${a.html}
  ${c?c.html+(mg&&!c.hist?`<div style="margin-top:8px"><button class="ghost" onclick="rmLine(${co.id})">حذف حساب كاش أوت</button></div>`:''):(mg?`<form onsubmit="return addCO(event)" style="margin-top:10px"><input type="hidden" name="m" value="${m.id}"><div class="row"><label>تفعيل حساب كاش أوت: الرصيد الحالي<input name="o" type="text" inputmode="decimal" value="0"></label><button class="go">تفعيل كاش أوت</button></div></form>`:'')}</div>`}).join('');
 const cur=S.fwCur&&MS.some(m=>m.id==S.fwCur)?S.fwCur:(MS[0]||{}).id;
 const opCard=MS.length?`<div class="card"><h2>تسجيل عملية فوري</h2><form onsubmit="return fwOp(event)"><div class="row"><label class="fwm" style="${MS.length>1?'':'display:none'}">الماكينة<select name="m" onchange="S.fwCur=+this.value">${MS.map(k=>`<option value="${k.id}" ${k.id==cur?'selected':''}>${k.name}</option>`).join('')}</select></label><label>العملية<select name="k"><option value="m:in">وارد رئيسي</option><option value="m:out">صادر رئيسي</option><option value="c:in">وارد كاش أوت</option><option value="c:out">صادر كاش أوت</option></select></label><label>المبلغ<input name="amt" type="text" inputmode="decimal" required></label><label>الرسوم<input name="fee" type="text" inputmode="decimal"></label><button class="go">حفظ</button></div><div class="mut" style="margin-top:6px">الوارد بيتخصم من النقدية والصادر بيتضاف ليها، والرسوم مكسب للمحل وبتتحسب في النقدية والربح زي الكاش وإنستا باي.</div></form></div>`:'';
 const tag=x=>{const k=S.fwm.find(k=>k.id==x.line);return(x.dir=='out'?'وارد ':'صادر ')+(k&&fwCOs().includes(k)?'كاش أوت':'رئيسي')};
 return`<div class="grid" style="margin-bottom:14px"><div class="card" style="margin:0;text-align:center"><div class="mut">إجمالي أرصدة فوري</div><div class="big">${f(fwBal())}</div></div><div class="card" style="margin:0;text-align:center"><div class="mut">الرئيسي</div><div class="big">${f(fwTot(MS))}</div></div><div class="card" style="margin:0;text-align:center"><div class="mut">كاش أوت</div><div class="big">${f(fwTot(fwCOs()))}</div></div></div>
 ${opCard}
 ${cards||'<div class="card empty">مفيش ماكينات لسه'+(mg?'، أضف أول ماكينة من تحت.':'، كلّم المدير.')+'</div>'}
 ${mg?`<div class="card"><h2>إضافة ماكينة</h2><form onsubmit="return addLine(event,'fw')"><div class="row"><label>اسم الماكينة<input name="n" required></label><label>رصيد الحساب الرئيسي<input name="o" type="text" inputmode="decimal" value="0"></label><button class="go">إضافة</button></div></form></div>`:''}
 <div class="card"><h2>آخر العمليات</h2>${ops.length?`<div class="tw"><table><tr><th>الوقت</th><th>الماكينة</th><th>العملية</th><th>المبلغ</th><th>الرسوم</th>${mg?'<th></th>':''}</tr>${ops.slice(-15).reverse().map(x=>{const k=S.fwm.find(k=>k.id==x.line);return`<tr><td>${tm(x.t)}</td><td>${k?(fwCOs().includes(k)?baseName(k):k.name):'-'}</td><td><span class="tag ${x.dir=='out'?'ok':'warn'}">${tag(x)}</span></td><td>${f(x.amt)}</td><td>${x.fee?f(x.fee):'-'}</td>${mg?`<td><button class="ghost" onclick="del(${x.id})">${delId==x.id?'تأكيد الحذف؟':'حذف'}</button></td>`:''}</tr>`}).join('')}</table></div>`:'<div class="empty">مفيش عمليات فوري لسه. سجّل أول وارد أو صادر من فوق.</div>'}</div>
 <div class="card"><h2>آخر الأيام</h2>${S.fw.length?`<div class="tw"><table><tr><th>اليوم</th><th>الحساب</th><th>افتتاحي</th><th>وارد</th><th>صادر</th><th>ختامي</th></tr>${S.fw.slice(0,15).map(d=>{const k=S.fwm.find(k=>k.id==d.line),o=k?fwOps(k).filter(x=>ymd(x.t)==d.day):[],wi=o.filter(x=>x.dir=='out').reduce((a,x)=>a+x.amt,0),so=o.filter(x=>x.dir=='in').reduce((a,x)=>a+x.amt,0);return`<tr><td>${d.day}</td><td>${k?(fwCOs().includes(k)?baseName(k)+' (كاش أوت)':k.name):'-'}</td><td>${f(d.opening)}</td><td>${wi?f(wi):'-'}</td><td>${so?f(so):'-'}</td><td>${d.closing==null?'-':f(d.closing)}</td></tr>`}).join('')}</table></div>`:'<div class="empty">مفيش أيام متسجلة لسه.</div>'}</div>`};
async function addCO(e){e.preventDefault();if(busy)return false;busy=true;try{const fm=e.target,m=S.fwm.find(x=>x.id==+fm.m.value);if(!m)return false;const r=await q(sb.from('lines').insert({shop_id:ME.shop_id,name:un(m.name)+CO_MARK,opening:+fm.o.value||0,sec:'fw'}).select().single());if(r.data){S.fwm.push({id:r.data.id,name:esc(r.data.name),open:+r.data.opening,sec:'fw'});render();bgLoad()}}finally{busy=false}return false}
// عملية فوري: زي الكاش وإنستا: الرسوم مكسب للمحل وبتتحسب في النقدية والربح
fwOp=async function(e){e.preventDefault();if(busy)return false;const fm=e.target,amt=+fm.amt.value,kd=fm.k.value,isC=kd[0]=='c',mid=+(fm.m&&fm.m.value||(fwMachines()[0]||{}).id),mach=S.fwm.find(x=>x.id==mid);if(!mach||!(amt>0))return false;
 const co=isC?fwCOof(mach):null,id=isC?(co&&co.id):mach.id;if(!id){alert('المدير لازم يفعّل حساب كاش أوت للماكينة دي الأول');return false}
 const fe=+fm.fee.value||0;busy=true;const bt=fm.querySelector('button.go');if(bt){bt.disabled=true;bt.textContent='جاري الحفظ...'}
 try{const inn=kd.endsWith(':in'),sh=ME.shop_id,r=await q(sb.from('transactions').insert({shop_id:sh,sec:'cash',line_id:id,dir:inn?'out':'in',amt,fee:fe,note:(inn?'وارد ':'صادر ')+(isC?'كاش أوت':'فوري')}).select().single());
  if(r.data){S.tx.push(mapTx(r.data));if(fe>0){const r2=await q(sb.from('transactions').insert({shop_id:sh,sec:'cash',dir:'in',amt:fe,auto:true,ref:r.data.id,note:'رسوم فوري'}).select().single());if(r2.data)S.tx.push(mapTx(r2.data))}S.fwCur=mach.id;render();bgLoad()}}finally{busy=false;if(bt){bt.disabled=false;bt.textContent='حفظ'}}return false};
// كتابة / تعديل الرصيد الحالي لحساب فوري (المدير)
async function fwSetBal(e){e.preventDefault();if(busy||!M())return false;busy=true;try{const fm=e.target,id=+fm.m.value,k=S.fwm.find(m=>m.id==id),v=+fm.b.value;if(!k||!isFinite(v))return false;const td=ymd(Date.now()),pr=S.fw.find(d=>d.line==id&&d.day==td);
 const row={shop_id:ME.shop_id,line_id:id,day:td,opening:pr?pr.opening:0,closing:pr?pr.closing:null};
 if(pr&&pr.closing!=null)row.closing=Math.round(v*100)/100;else row.opening=Math.round((v-fwNet(k,d=>d==td))*100)/100;
 const r=await q(sb.from('fawry_days').upsert(row,{onConflict:'shop_id,day,line_id'}));if(r.error)return false;
 const n={line:id,day:td,opening:row.opening,closing:row.closing,inflow:0,cash:0},ix=S.fw.findIndex(d=>d.line==id&&d.day==td);if(ix>=0)S.fw[ix]=n;else S.fw.unshift(n);S.fw.sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:0);render();bgLoad()}finally{busy=false}return false}
</script>
<script>
(function(){var A='٠١٢٣٤٥٦٧٨٩',P='۰۱۲۳۴۵۶۷۸۹';
window.fm0=function(e){return e.target&&e.target.line!==undefined&&e.target.line!==null};
function fix(v,d){var r=v.replace(/[٠-٩]/g,function(c){return A.indexOf(c)}).replace(/[۰-۹]/g,function(c){return P.indexOf(c)});if(d)r=r.replace(/٫/g,'.').replace(/[٬،,]/g,'').replace(/[^0-9.\-]/g,'');return r}
function run(el){if(!el||!el.matches||!el.matches('input,textarea'))return;var t=el.type;if(t=='password'||t=='file'||t=='checkbox'||t=='hidden'||t=='radio')return;var v=el.value,n=fix(v,el.inputMode=='decimal');if(n!==v){var p=el.selectionStart;el.value=n;try{el.setSelectionRange(p,p)}catch(x){}}}
document.addEventListener('input',function(e){run(e.target)},true);
document.addEventListener('submit',function(e){e.target.querySelectorAll('input,textarea').forEach(run)},true);
})();
</script>
