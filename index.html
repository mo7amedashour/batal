:root[data-sec="ig"]{--pri:var(--p-ig)}:root[data-sec="cash"]{--pri:var(--p-cash)}:root[data-sec="net"],:root[data-sec="jd"]{--pri:var(--p-net)}:root[data-sec="aj"]{--pri:#1f5fa8}:root[data-sec="fw"]{--pri:#f5c400;--priT:#1a1a1a}p.mut,form+div.mut{display:none} html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:auto;background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,"Segoe UI",sans-serif;font-size:16px}

input,select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:110px}

.tag.crit{background:var(--bd2);color:var(--card)}

.why{display:block;margin-top:4px;font-size:13px;font-weight:700;color:var(--c,var(--mut))}
</style>

async function saveShop(e,id){e.preventDefault();const f=e.target;await q(sb.from('shops').update({active:f.a.checked}).eq('id',id));await q(sb.from('shop_limits').update({limit_day:+f.d.value,limit_month:+f.m.value,fee_low:+f.lo.value,fee_th:+f.th.value,fee_rate:+f.r.value,fee_step:+f.s.value,ded_rate:+f.x.value}).eq('shop_id',id));adminView();return false}
async function boot(){hd.style.display='none';const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
 let r=await sb.rpc('me2');if(r.error)r=await sb.rpc('me');ME=r.data;if(!ME||!ME.role)return msg('الحساب مش مربوط بمحل. كلّم الإدارة.');
 if(ME.role=='admin')return adminView();if(!ME.active)return msg('الخدمة موقوفة على المحل ده. كلّم الإدارة.');
 await load();if(!M()&&S.tab=='jd')S.tab='vc';shop.contentEditable=M()?'true':'false';hd.style.display='';render();focusAmt()}
const sig=()=>JSON.stringify([S.lim,S.fee,S.ded,S.lines,S.igs,S.fwm,S.fw,S.tx,S.cash]);
let lt=0;addEventListener('touchstart',()=>{lt=Date.now()},{passive:true});
setInterval(async()=>{if(!ME||!['shop','staff'].includes(ME.role)||!ME.active||document.hidden||S.edit||Date.now()-lt<15000||document.activeElement.matches('input,select,[contenteditable]'))return;const a=sig();await load();if(sig()!==a)render()},30000);
async function logout(){await sb.auth.signOut();location.reload()}{const t0=txRun;txRun=async function(e,sec){if(sec!='ajil')return t0(e,sec);e.preventDefault();const fm=e.target,amt=+fm.amt.value;if(!(amt>0))return false;const w=fm.dir.value=='in',sh=ME.shop_id,nm=fm.who.value.trim()||'-',r=await q(sb.from('transactions').insert({shop_id:sh,sec,dir:fm.dir.value,amt,note:nm}).select().single());if(r.data&&(!fm.link||fm.link.checked))await q(sb.from('transactions').insert({shop_id:sh,sec:'cash',dir:w?'out':'in',amt,auto:true,ref:r.data.id,note:'آجل - '+nm}));await load();render();return false}}
{const r0=render;render=function(){r0();if(S.tab=='aj'){const f=document.querySelector('#app form');if(f&&!f.link){const row=f.querySelector('.row'),l=document.createElement('label');l.style.cssText='flex-direction:row;align-items:center;gap:6px';l.innerHTML='<input type="checkbox" name="link" checked style="min-width:0">سجّل النقدي تلقائي';row.insertBefore(l,row.querySelector('button'))}}}}
function jdView(){const since=S.per=='d'?sod():S.per=='m'?som():0,PL={d:'اليوم',m:'الشهر ده',a:'من البداية'}[S.per],
 R=[['الكاش',S.lines.reduce((a,l)=>a+l.open,0)+net(x=>x.sec=='vc')],['إنستا باي',S.igs.reduce((a,l)=>a+l.open,0)+net(x=>x.sec=='ig')],['فوري',fwBal()],['آجل',net(x=>x.sec=='ajil')],['النقدية',S.cash+net(x=>x.sec=='cash')]],T=R.reduce((a,x)=>a+x[1],0),
 cap=net(x=>x.cap,since),aj=new Set(S.tx.filter(x=>x.sec=='ajil').map(x=>x.id)),profit=net(x=>x.sec!='ajil'&&!(x.auto&&aj.has(x.ref)),since)+fwMove(ymd(since))-cap;
 return`<div class="card"><div class="row"><label>الفترة (للربح)<select onchange="S.per=this.value;render()"><option value="d" ${S.per=='d'?'selected':''}>اليوم</option><option value="m" ${S.per=='m'?'selected':''}>الشهر ده</option><option value="a" ${S.per=='a'?'selected':''}>من البداية</option></select></label></div></div>
 <div class="card"><h2>الجرد</h2><div class="tw"><table><tr><th>القسم</th><th>المبلغ</th></tr>${R.map(([n,v])=>`<tr><td>${n}</td><td class="${v<0?'neg':''}">${f(v)}</td></tr>`).join('')}<tr><td><b>الإجمالي</b></td><td><b>${f(T)}</b></td></tr><tr><td><b>صافي الربح (${PL})</b></td><td class="${profit<0?'neg':''}"><b>${f(profit)} ج</b></td></tr></table></div></div>
 ${reconCard('vc')}${reconCard('ig')}${reconCard('cash')}
 <div class="card"><h2>رأس مال أُضيف أو سُحب</h2><form onsubmit="return addCap(event)"><div class="row"><label>النوع<select name="k"><option value="1">أُضيف للمحل</option><option value="-1">سُحب من المحل</option></select></label><label>فين<select name="w"><option value="cash">النقدية</option>${S.igs.map(l=>`<option value="ig:${l.id}">إنستا: ${l.name}</option>`).join('')}${S.lines.map(l=>`<option value="vc:${l.id}">${l.name}</option>`).join('')}</select></label><label>المبلغ<input name="a" type="number" min="1" required></label><button class="go">سجّل</button></div></form></div>
 <div class="card"><h2>الموظفين</h2>${S.staff.map(u=>`<div class="row" style="margin-bottom:8px"><span>${esc(u.email)}</span><button class="ghost" onclick="rmStaff('${u.user_id}')">إزالة</button></div>`).join('')||'<div class="mut" style="margin-bottom:8px">مفيش موظفين لسه.</div>'}<form onsubmit="return addStaff(event)"><div class="row"><label>إيميل الموظف<input name="e" type="email" required></label><button class="go">إضافة</button></div><div class="hint neg" id="se"></div></form></div>
 <div class="card"><div class="row"><button class="ghost" onclick="exportCsv()">تصدير المعاملات (CSV)</button></div></div>${dataCard()}`}boot();
</script>
